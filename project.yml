name: DisplayCalib
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DisplayCalib:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Display Calib
        NSCameraUsageDescription: "La fotocamera frontale misura il colore dello schermo del monitor."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        # CAMBIALO con un identificatore unico tuo (es. dev.tuonome.displaycalib)
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.displaycalib
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
