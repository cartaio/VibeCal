name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version and repo layout
        run: |
          xcodebuild -version
          ls -la
          ls -la Sources

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project VibeCal.xcodeproj \
            -scheme VibeCal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: |
          echo "===== ERRORS ====="
          grep -nE "error:" build.log | head -n 40 || echo "(no 'error:' lines found)"
          echo "===== LAST 40 LINES ====="
          tail -n 40 build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VibeCal.app Payload/
          zip -r VibeCal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: VibeCal-ipa
          path: VibeCal.ipa
